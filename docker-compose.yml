services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prashna
      POSTGRES_USER: prashna
      POSTGRES_PASSWORD: prashna
    ports: ["5432:5432"]
    volumes: ["prashna_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prashna"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  prashna_pg:
